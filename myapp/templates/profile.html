<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - JD Extractor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px clamp(20px, 5vw, 72px);
            background: #16324f;
            color: #fff;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.45); border-radius: 6px; font-weight: 800; }
        .brand span { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
        nav { display: flex; gap: 18px; align-items: center; }
        nav a { min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: #dcebf8; font-size: 14px; font-weight: 400; }

        h1 {
            font-size: clamp(24px, 4vw, 34px);
        }

        main {
            width: min(1180px, calc(100% - 32px));
            margin: 36px auto;
            padding: 28px;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.1);
        }

        a {
            min-height: 42px;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #2563eb;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand"><div class="brand-mark">JM</div><span>Job Match Intelligence</span></div>
        <nav><a href="/dashboard">Dashboard</a><a href="/analysis">Match analysis</a></nav>
    </header>

    <main>
        {% include "profile_form.html" %}
    </main>

</body>
</html>
