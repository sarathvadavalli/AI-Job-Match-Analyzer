<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Description Extractor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { min-height: 100vh; font-family: "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 18px clamp(20px, 5vw, 72px); background: #16324f; color: #fff; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.45); border-radius: 6px; font-weight: 800; }
        .brand span { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
        nav { display: flex; gap: 18px; align-items: center; }
        nav a { color: #dcebf8; font-size: 14px; text-decoration: none; }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 42px auto 64px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .upload-area {
            display: block;
            width: 100%;

            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s ease;
            background: #f8fafc;
        }

        .upload-area:hover {
            border-color: #6366f1;
            background: #f5f3ff;
        }

        .upload-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .upload-area p {
            color: #64748b;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 14px;
        }

        .file-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .upload-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .upload-btn:hover {
            background: #4338ca;
        }

        .upload-btn:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #ecfdf5;
            color: #065f46;
            display: none;
        }

        .error-message {
            margin-top: 15px;
            color: red;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div class="brand"><div class="brand-mark">JM</div><span>Job Match Intelligence</span></div>
    <nav><a href="/dashboard">Dashboard</a><a href="/analysis">Match analysis</a></nav>
</header>

<div class="container">

    <div class="header">
        <h1>Job Description Extractor</h1>
        <p>Upload a job description and let AI extract the important information.</p>
    </div>

    <form id="uploadForm">

        <label class="upload-area" for="fileInput">

            <div class="upload-icon">📄</div>

            <h3>Upload Job Description</h3>

            <p>
                Click to browse or choose a file
            </p>

            <p style="margin-top: 6px;">
                PDF, DOCX or TXT
            </p>

            <input
                type="file"
                id="fileInput"
                name="file"
                accept=".pdf,.docx,.txt"
            >

        </label>

        <div class="file-info" id="fileInfo">
            <strong>Selected file:</strong>
            <span id="fileName"></span>
        </div>

        <button
            type="submit"
            class="upload-btn"
            id="uploadBtn"
        >
            Extract Job Information
        </button>

    </form>

    <div class="result" id="result"></div>
    <div id="errorMessage" class="error-message"></div>
    <div id="extractedDetails" class="extracted-details"></div>

</div>


<script>

    const fileInput = document.getElementById("fileInput");
    const fileInfo = document.getElementById("fileInfo");
    const fileName = document.getElementById("fileName");

    const uploadForm = document.getElementById("uploadForm");
    const uploadBtn = document.getElementById("uploadBtn");

    const result = document.getElementById("result");


    // Show selected file
    fileInput.addEventListener("change", function () {

        if (fileInput.files.length > 0) {

            const file = fileInput.files[0];

            fileName.textContent = file.name;

            fileInfo.style.display = "block";
        }

    });


    // Upload file
    uploadForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const file = fileInput.files[0];

        if (!file) {
            alert("Please upload a file");
            return;
        }

        const formData = new FormData();

        formData.append("file", file);

        uploadBtn.disabled = true;
        uploadBtn.textContent = "Extracting...";

        result.style.display = "none";

        try {

            const response = await fetch(
                "/jd/extract",
                {
                    method: "POST",
                    body: formData
                }
            );
            
            const data = await response.json();
            console.log(data);

            const errorMessage = document.getElementById("errorMessage");

            if (!response.ok) {
                errorMessage.textContent = data.detail.FormData || "An error occurred while extracting job information.";
                errorMessage.style.display = "block";
                return;
            }

            result.textContent =
                "Job information extracted successfully!";

            result.style.display = "block";

            const extractedDetails = document.getElementById("extractedDetails");

            extractedDetails.innerHTML = `
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;

        } catch (error) {

            result.textContent = error.message;

            result.style.background = "#fef2f2";
            result.style.color = "#991b1b";
            result.style.display = "block";

        } finally {

            uploadBtn.disabled = false;
            uploadBtn.textContent = "Extract Job Information";

        }

    });

</script>

</body>
</html>
