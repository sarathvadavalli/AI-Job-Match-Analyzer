services:
  - type: web
    name: url-shortener-fastapi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Public variables
      - key: ENVIRONMENT
        value: production
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      
      # Secret variables
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
